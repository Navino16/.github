name: Labels

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'labels.json'
      - 'actions/sync-labels/**'

permissions:
  issues: write

jobs:
  sync:
    name: Sync labels
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Sync labels
        uses: ./actions/sync-labels
