name: Close linked issues

# GitHub only applies closing keywords when a pull request merges into the default branch;
# feature pull requests target develop, so this closes their issues at merge time.
on:
  workflow_call:

permissions: {}

jobs:
  close:
    name: Close linked issues
    if: github.event.pull_request.merged == true && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Close the issues referenced with a closing keyword
        uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const re = /\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?):?\s+#(\d+)\b/gi;
            const ids = new Set([...(pr.body || "").matchAll(re)].map((m) => Number(m[1])));
            if (ids.size === 0) {
              core.info("No closing keyword in the pull request body.");
              return;
            }
            for (const issue_number of ids) {
              const { data: issue } = await github.rest.issues.get({ ...context.repo, issue_number });
              if (issue.pull_request) {
                core.info(`#${issue_number} is a pull request, skipped`);
                continue;
              }
              if (issue.state === "closed") {
                core.info(`#${issue_number} is already closed`);
                continue;
              }
              await github.rest.issues.update({ ...context.repo, issue_number, state: "closed", state_reason: "completed" });
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number,
                body: `Closed by #${pr.number}, merged into \`${pr.base.ref}\`.`,
              });
              core.info(`Closed #${issue_number}`);
            }
